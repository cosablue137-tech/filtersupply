<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:30px 36px}
  .wrap{display:flex;gap:40px;align-items:flex-start}
  .card{width:200px}
  .shot{aspect-ratio:4/5;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .shot span{font-family:var(--font-jp);font-size:34px;color:#e2ded6}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
  .ttl{font-family:var(--font-display);font-weight:400;font-size:19px;color:#000}
  .pr{font-family:var(--font-meta);font-size:13px;color:#000;font-variant-numeric:tabular-nums}
  .meta{font-family:var(--font-meta);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:6px}
  .note{font-family:var(--font-meta);font-size:11px;color:var(--mute);max-width:200px;line-height:1.6}
</style></head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="shot"><span>豆</span></div>
      <div class="top"><span class="ttl">Morning Blend</span><span class="pr">¥1,800</span></div>
      <div class="meta">Medium · 200g</div>
    </div>
    <div class="note">No container chrome. A still on white, a hairline frame, type set tight beneath. The white-on-canvas contrast is the only "elevation".</div>
  </div>
</body></html>
