<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:30px 36px;font-family:var(--font-meta)}
  .eyebrow{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:22px}
  .stack{display:flex;flex-direction:column;gap:18px}
  .lbl{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#000}
  .micro{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
  .meta{font-size:12px;letter-spacing:.04em;color:#000}
  .price{font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:.01em;color:#000}
  .dot{color:var(--mute)}
</style></head>
<body>
  <div class="eyebrow">Metadata · Inter 400 / 500</div>
  <div class="stack">
    <div class="lbl">Single Origin · Eyebrow / Label</div>
    <div class="micro">Add to cart · Nav · Micro</div>
    <div class="meta">Ethiopia <span class="dot">·</span> Washed <span class="dot">·</span> 2025</div>
    <div class="price">¥1,800 <span class="dot">·</span> 200g</div>
  </div>
</body></html>
