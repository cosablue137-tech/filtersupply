<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);font-family:var(--font-meta);padding:28px 32px}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .sw{display:flex;flex-direction:column;gap:10px}
  .chip{height:84px;border:1px solid var(--line)}
  .name{font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink)}
  .hex{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
  .note{font-size:11px;color:var(--mute);margin-top:16px;line-height:1.5}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#000"></div><div class="name">Ink</div><div class="hex">#000000</div></div>
    <div class="sw"><div class="chip" style="background:rgba(0,0,0,.8)"></div><div class="name">Ink&nbsp;80%</div><div class="hex">Press fill</div></div>
    <div class="sw"><div class="chip" style="background:rgba(0,0,0,.55)"></div><div class="name">Ink&nbsp;55%</div><div class="hex">Support</div></div>
    <div class="sw"><div class="chip" style="background:#8a857d"></div><div class="name">Mute</div><div class="hex">#8A857D</div></div>
  </div>
  <div class="note">Pure ink for all text & UI. No accent color exists — emphasis comes from scale, space, and black/white inversion.</div>
</body></html>
