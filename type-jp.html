<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:30px 36px}
  .eyebrow{font-family:var(--font-meta);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:18px}
  .pair{display:flex;align-items:baseline;gap:14px}
  .en{font-family:var(--font-display);font-weight:400;font-size:40px;color:#000;line-height:1}
  .jp{font-family:var(--font-jp);font-size:15px;color:var(--mute);letter-spacing:.08em}
  .body{font-family:var(--font-body);font-size:17px;line-height:1.7;color:#000;margin-top:18px;max-width:34rem}
  .body .jp-in{font-family:var(--font-jp);color:var(--mute)}
</style></head>
<body>
  <div class="eyebrow">Bilingual texture · JP is texture, not translation</div>
  <div class="pair"><span class="en">Morning Blend</span><span class="jp">モーニングブレンド</span></div>
  <div class="body"><span class="jp-in">私たちについて。</span> Roasted in Fukuoka, in small batches, the day it ships.</div>
</body></html>
