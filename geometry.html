<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:30px 36px;font-family:var(--font-meta)}
  .row{display:flex;gap:40px;align-items:flex-start}
  .item{display:flex;flex-direction:column;gap:12px}
  .demo{width:120px;height:80px;background:#fff;border:1px solid var(--ink)}
  .lbl{font-size:11px;letter-spacing:.04em;color:#000}
  .val{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="demo"></div><div class="lbl">Border radius</div><div class="val">0 · everywhere</div></div>
    <div class="item"><div class="demo"></div><div class="lbl">Box shadow</div><div class="val">None · ever</div></div>
    <div class="item"><div class="demo" style="border:1px solid var(--line)"></div><div class="lbl">Hairline</div><div class="val">1px · 12% ink</div></div>
  </div>
</body></html>
