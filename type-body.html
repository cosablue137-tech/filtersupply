<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:30px 36px}
  .eyebrow{font-family:var(--font-meta);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
  p{font-family:var(--font-body);font-size:18px;line-height:1.7;color:#000;margin:0;max-width:34rem}
  em{font-style:italic}
  .sub{font-family:var(--font-meta);font-size:11px;letter-spacing:.04em;color:var(--mute);margin-top:18px}
</style></head>
<body>
  <div class="eyebrow">Body · Lora 400 / 400 italic</div>
  <p>Ethiopia, Yirgacheffe. Washed. A quiet, balanced cup for the first light — notes of bergamot, white peach, and <em>black tea</em>.</p>
  <div class="sub">Line-height 1.7 · measure capped at 34rem · text-wrap: pretty.</div>
</body></html>
