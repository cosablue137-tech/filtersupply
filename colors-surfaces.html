<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);font-family:var(--font-meta);padding:28px 32px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .sw{display:flex;flex-direction:column;gap:10px}
  .chip{height:84px;border:1px solid var(--line)}
  .name{font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--ink)}
  .hex{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .note{font-size:11px;color:var(--mute);margin-top:6px;line-height:1.5}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#f8f7f5"></div><div class="name">Canvas</div><div class="hex">#F8F7F5</div></div>
    <div class="sw"><div class="chip" style="background:#f1efeb"></div><div class="name">Canvas&nbsp;deep</div><div class="hex">#F1EFEB</div></div>
    <div class="sw"><div class="chip" style="background:#fff"></div><div class="name">Card white</div><div class="hex">#FFFFFF</div></div>
  </div>
  <div class="note">Warm off-white surfaces. Pure white appears only behind a product still.</div>
</body></html>
