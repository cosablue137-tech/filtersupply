<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:26px 36px}
  .line{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--line);padding:12px 0}
  .line:last-child{border-bottom:none}
  .tok{font-family:var(--font-meta);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);width:96px;flex:none}
  .spec{font-family:var(--font-display);font-weight:400;color:#000;line-height:1}
</style></head>
<body>
  <div class="line"><span class="tok">Hero</span><span class="spec" style="font-size:46px">Aa 福</span></div>
  <div class="line"><span class="tok">Display</span><span class="spec" style="font-size:34px">Aa 福</span></div>
  <div class="line"><span class="tok">H1</span><span class="spec" style="font-size:27px">Aa 福</span></div>
  <div class="line"><span class="tok">H2</span><span class="spec" style="font-size:21px">Aa 福</span></div>
  <div class="line"><span class="tok">Body · Lora</span><span class="spec" style="font-family:var(--font-body);font-size:17px">Aa 福</span></div>
  <div class="line"><span class="tok">Meta · Inter</span><span class="spec" style="font-family:var(--font-meta);font-size:12px;letter-spacing:.18em;text-transform:uppercase">Aa Meta</span></div>
</body></html>
