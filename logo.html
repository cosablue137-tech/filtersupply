<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Filter Supply — Logo</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body {
    background: var(--canvas);
    font-family: var(--font-meta);
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 56px 40px;
    min-height: 200px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .cell:nth-child(2n) { border-right: none; }
  .cell.dark { background: var(--ink); }
  .logo { width: min(320px, 70%); height: auto; display: block; }
  .logo.sm { width: 190px; }
  .tag {
    font-size: 11px;
    letter-spacing: var(--track-micro);
    text-transform: uppercase;
    color: var(--mute);
  }
  .dark .tag { color: rgba(255,255,255,0.5); }
  .lockup { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .jp {
    font-family: var(--font-jp);
    font-size: 12px;
    letter-spacing: 0.42em;
    color: var(--mute);
    padding-left: 0.42em;
  }
</style>
</head>
<body>
  <div class="cell">
    <img class="logo" src="logo-ink.png" alt="Filter Supply" />
    <div class="tag">Primary · ink on canvas</div>
  </div>
  <div class="cell dark">
    <img class="logo" src="logo-white.png" alt="Filter Supply" />
    <div class="tag">Reversed · on ink</div>
  </div>
  <div class="cell">
    <div class="lockup">
      <img class="logo sm" src="logo-ink.png" alt="Filter Supply" />
      <div class="jp">フィルターサプライ</div>
    </div>
    <div class="tag">Lockup · with JP texture</div>
  </div>
  <div class="cell">
    <img class="logo sm" src="logo-ink.png" alt="Filter Supply" />
    <div class="tag">Clear space · ≥ cap-height each side</div>
  </div>
</body>
</html>
