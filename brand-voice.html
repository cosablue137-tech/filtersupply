<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:30px 36px}
  .eyebrow{font-family:var(--font-meta);font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:16px}
  .v{font-family:var(--font-body);font-size:17px;line-height:1.7;color:#000;max-width:34rem}
  .v em{font-style:italic}
  .x{color:var(--mute);text-decoration:line-through}
</style></head>
<body>
  <div class="eyebrow">Voice · plain, quiet, matter-of-fact</div>
  <div class="v">Roasted the day it ships. <em>モーニングブレンド</em> — a quiet, balanced cup for the first light. Ethiopia, Yirgacheffe. Washed.</div>
  <div class="v" style="margin-top:16px;font-size:13px"><span class="x">Our amazing best-seller — don't miss out!</span> &nbsp;No hype. No emoji. No exclamation.</div>
</body></html>
