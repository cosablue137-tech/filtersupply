<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:26px 36px;font-family:var(--font-meta)}
  .line{display:flex;align-items:center;gap:18px;padding:7px 0}
  .tok{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);width:64px;flex:none}
  .val{font-size:10px;letter-spacing:.1em;color:var(--mute);width:48px;flex:none;text-align:right}
  .bar{height:14px;background:var(--ink)}
</style></head>
<body>
  <div class="line"><span class="tok">s-1</span><span class="bar" style="width:4px"></span><span class="val">4</span></div>
  <div class="line"><span class="tok">s-2</span><span class="bar" style="width:8px"></span><span class="val">8</span></div>
  <div class="line"><span class="tok">s-3</span><span class="bar" style="width:16px"></span><span class="val">16</span></div>
  <div class="line"><span class="tok">s-4</span><span class="bar" style="width:24px"></span><span class="val">24</span></div>
  <div class="line"><span class="tok">s-5</span><span class="bar" style="width:40px"></span><span class="val">40</span></div>
  <div class="line"><span class="tok">s-6</span><span class="bar" style="width:64px"></span><span class="val">64</span></div>
  <div class="line"><span class="tok">s-7</span><span class="bar" style="width:96px"></span><span class="val">96</span></div>
  <div class="line"><span class="tok">s-8</span><span class="bar" style="width:144px"></span><span class="val">144</span></div>
  <div class="line"><span class="tok">s-9</span><span class="bar" style="width:224px"></span><span class="val">224</span></div>
</body></html>
