<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Filter Supply — ショップ / 焙煎</title>
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); font-family: var(--font-body); }
  * { box-sizing: border-box; }
  button { font: inherit; }

  /* ---- Header (shared shape) ---- */
  .fs-header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px; padding: 0 var(--gutter);
    background: var(--canvas); border-bottom: 1px solid var(--line);
  }
  .fs-header__brand img { height: 15px; width: auto; display: block; }
  .fs-header__nav { display: flex; gap: 30px; }
  .fs-navlink {
    font-family: var(--font-jp); font-size: 13px; font-weight: 400;
    letter-spacing: 0.1em; text-decoration: none; white-space: nowrap;
    color: var(--ink); padding-bottom: 3px; border-bottom: 1px solid transparent;
    white-space: nowrap;
    transition: border-color 0.4s var(--ease);
  }
  .fs-navlink:hover, .fs-navlink.is-active { border-color: var(--ink); }
  .fs-header__tools { display: flex; align-items: center; gap: 20px; }
  .fs-iconbtn { background: none; border: none; cursor: pointer; color: var(--ink); display: flex; align-items: center; gap: 6px; padding: 4px; }
  .fs-cartcount { font-family: var(--font-meta); font-size: 11px; }

  /* ---- Catalogue ---- */
  .sf-catalog { padding: clamp(48px, 8vw, 96px) var(--gutter) 120px; }
  .sf-catalog__head { max-width: 40rem; margin-bottom: clamp(40px, 6vw, 72px); }
  .sf-filter {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 52px;
  }
  .sf-filter__cats { display: flex; gap: 12px; flex-wrap: wrap; }
  .sf-filter > span { white-space: nowrap; padding-left: 16px; }
  .sf-chip {
    font-family: var(--font-jp); font-size: 12px; font-weight: 400;
    letter-spacing: 0.06em;
    padding: 9px 16px; border: 1px solid var(--line); background: transparent;
    color: var(--ink); cursor: pointer; border-radius: 0; white-space: nowrap;
    transition: background-color 0.35s var(--ease), color 0.35s var(--ease), border-color 0.35s var(--ease);
  }
  .sf-chip:hover { border-color: var(--ink); }
  .sf-chip.is-active { background: var(--ink); color: var(--canvas); border-color: var(--ink); }

  .sf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(28px, 4vw, 56px) clamp(24px, 3vw, 44px); }
  .sf-card { text-decoration: none; color: var(--ink); display: block; }
  .sf-card__media {
    aspect-ratio: 4 / 5; background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.4s var(--ease);
  }
  .sf-card:hover .sf-card__media { opacity: 0.72; }
  .sf-card__ghost { font-size: 54px; color: #ece8e0; }
  .sf-card__row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-top: 16px; }
  .sf-card__name { font-family: var(--font-jp-display); font-weight: 400; font-size: 17px; white-space: nowrap; border-bottom: 1px solid transparent; transition: border-color 0.4s var(--ease); }
  .sf-card:hover .sf-card__name { border-color: var(--ink); }
  .sf-card__romaji { font-family: var(--font-meta); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); margin-top: 6px; }

  /* ---- Product detail ---- */
  .sf-detail { padding: clamp(28px, 4vw, 48px) var(--gutter) 140px; }
  .sf-back { background: none; border: none; cursor: pointer; color: var(--ink); padding: 0; margin-bottom: clamp(28px, 4vw, 52px); white-space: nowrap; }
  .sf-detail__grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(40px, 7vw, 100px); align-items: start; }
  .mk-still { position: relative; width: 100%; background: #fff; border: 1px solid var(--line); overflow: hidden; }
  .mk-slot { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sf-detail__info { padding-top: 8px; max-width: 30rem; }
  .sf-spec { display: grid; grid-template-columns: auto 1fr; gap: 0; margin: 34px 0 0; border-top: 1px solid var(--line); }
  .sf-spec dt { font-family: var(--font-meta); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); padding: 14px 0; }
  .sf-spec dd { font-family: var(--font-body); font-size: 16px; margin: 0; padding: 14px 0; text-align: right; border-bottom: 1px solid var(--line); }
  .sf-spec dt { border-bottom: 1px solid var(--line); }
  .sf-grind { margin-top: 34px; }
  .sf-grind__opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .sf-buy { display: flex; align-items: stretch; gap: 14px; margin-top: 36px; }

  /* ---- Stepper ---- */
  .sf-stepper { display: flex; align-items: center; border: 1px solid var(--ink); }
  .sf-stepper button { background: none; border: none; cursor: pointer; color: var(--ink); width: 46px; height: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; }
  .sf-stepper button:hover { background: var(--ink); color: var(--canvas); }
  .sf-stepper__val { font-family: var(--font-meta); font-size: 14px; min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
  .sf-stepper--sm button { min-height: 34px; width: 34px; }

  /* ---- Cart drawer ---- */
  .sf-cart { position: fixed; inset: 0; z-index: 90; visibility: hidden; opacity: 0; transition: opacity 0.4s var(--ease), visibility 0s linear 0.4s; }
  .sf-cart.is-open { visibility: visible; opacity: 1; transition: opacity 0.4s var(--ease); }
  .sf-cart__scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.18); }
  .sf-cart__panel {
    position: absolute; top: 0; right: 0; height: 100%; width: min(420px, 100%);
    background: var(--canvas); border-left: 1px solid var(--ink);
    display: flex; flex-direction: column; padding: 28px 32px;
  }
  .sf-cart__head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .sf-cart__empty { padding-top: 80px; text-align: center; }
  .sf-cart__lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .sf-line { display: flex; gap: 18px; padding: 24px 0; border-bottom: 1px solid var(--line); }
  .sf-line__thumb { width: 72px; height: 90px; flex: none; background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
  .sf-line__thumb span { font-size: 26px; color: #e6e1d8; }
  .sf-line__body { flex: 1; }
  .sf-line__top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .sf-line__name { font-family: var(--font-jp-display); font-size: 16px; }
  .sf-line__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .sf-line__remove { background: none; border: none; cursor: pointer; color: var(--mute); border-bottom: 1px solid transparent; padding: 0 0 2px; }
  .sf-line__remove:hover { color: var(--ink); border-color: var(--ink); }
  .sf-cart__foot { padding-top: 22px; border-top: 1px solid var(--ink); }
  .sf-cart__ship { color: var(--mute); text-align: center; padding-bottom: 18px; }
  .sf-cart__subtotal { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }

  /* ---- Footer (reused) ---- */
  .fs-footer { padding: clamp(60px, 9vw, 110px) var(--gutter) 40px; border-top: 1px solid var(--ink); }
  .fs-footer__top { display: grid; grid-template-columns: 1fr 1.3fr; gap: 60px; }
  .fs-footer__brand img { height: 16px; }
  .fs-footer__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .fs-footer__head { font-family: var(--font-meta); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; margin-bottom: 18px; }
  .fs-footer__col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .fs-footer__col li { font-family: var(--font-jp); font-size: 14px; color: var(--ink-55); }
  .fs-footer__base { display: flex; justify-content: space-between; margin-top: 80px; padding-top: 24px; border-top: 1px solid var(--line); }

  @media (max-width: 860px) {
    .fs-header__nav { display: none; }
    .sf-grid { grid-template-columns: 1fr 1fr; }
    .sf-detail__grid { grid-template-columns: 1fr; }
    .fs-footer__top { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="../../assets/image-slot.js"></script>
  <script type="text/babel" src="../../assets/icons.jsx"></script>
  <script src="../../ui_kits/products.js"></script>
  <script type="text/babel" src="../marketing/Footer.jsx"></script>
  <script type="text/babel" src="StoreHeader.jsx"></script>
  <script type="text/babel" src="Catalog.jsx"></script>
  <script type="text/babel" src="ProductDetail.jsx"></script>
  <script type="text/babel" src="CartDrawer.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const products = window.FS_PRODUCTS;
      const [view, setView] = useState("catalog");   // catalog | product
      const [selected, setSelected] = useState(null);
      const [category, setCategory] = useState("all");
      const [cartOpen, setCartOpen] = useState(false);
      const [items, setItems] = useState([]);

      const count = items.reduce((s, i) => s + i.qty, 0);

      const open = (p) => { setSelected(p); setView("product"); window.scrollTo(0, 0); };
      const home = () => { setView("catalog"); setCategory("all"); window.scrollTo(0, 0); };
      const pickCategory = (c) => { setCategory(c); setView("catalog"); window.scrollTo(0, 0); };

      const add = (p, qty, grind) => {
        const key = p.id + "|" + (grind || "x");
        setItems((prev) => {
          const ex = prev.find((i) => i.key === key);
          if (ex) return prev.map((i) => i.key === key ? { ...i, qty: i.qty + qty } : i);
          return [...prev, { key, id: p.id, qty, grind }];
        });
        setCartOpen(true);
      };
      const setQty = (key, qty) => setItems((prev) => prev.map((i) => i.key === key ? { ...i, qty } : i));
      const remove = (key) => setItems((prev) => prev.filter((i) => i.key !== key));

      return (
        <React.Fragment>
          <StoreHeader cartCount={count} category={category}
            onCart={() => setCartOpen(true)} onCategory={pickCategory} onHome={home} />

          {view === "catalog"
            ? <Catalog products={products} category={category} onCategory={pickCategory} onOpen={open} />
            : <ProductDetail product={selected} onBack={() => setView("catalog")} onAdd={add} />}

          <SiteFooter />

          <CartDrawer open={cartOpen} items={items} products={products}
            onClose={() => setCartOpen(false)} onQty={setQty} onRemove={remove} />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
