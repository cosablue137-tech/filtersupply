<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:30px 36px}
  .eyebrow{font-family:var(--font-meta);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:18px}
  h1{font-family:var(--font-display);font-weight:400;font-size:52px;line-height:1.06;letter-spacing:-.01em;margin:0;color:#000}
  .sub{font-family:var(--font-meta);font-size:11px;letter-spacing:.04em;color:var(--mute);margin-top:16px}
</style></head>
<body>
  <div class="eyebrow">Display · Playfair Display 400</div>
  <h1>Roasted the day<br/>it ships.</h1>
  <div class="sub">Weight 400 only — never bold. Tight leading (1.08), letter-spacing −0.01em.</div>
</body></html>
