<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:32px 36px;font-family:var(--font-meta)}
  .row{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
  .ic{display:flex;flex-direction:column;align-items:center;gap:10px}
  .ic svg{display:block}
  .ic span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .note{font-size:11px;color:var(--mute);margin-top:22px;line-height:1.5}
  svg{stroke:#000;stroke-width:1;fill:none;stroke-linecap:square;stroke-linejoin:miter}
</style></head>
<body>
  <div class="row">
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 7 H19 L18 21 H6 Z"/><path d="M9 7 V5.5 A3 3 0 0 1 15 5.5 V7"/></svg><span>Cart</span></div>
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg><span>Search</span></div>
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/></svg><span>Menu</span></div>
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg><span>Close</span></div>
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21 a8 8 0 0 1 16 0"/></svg><span>Account</span></div>
    <div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14,6 20,12 14,18"/></svg><span>Arrow</span></div>
  </div>
  <div class="note">Hairline 1px glyphs, squared ends, zero fill — the only iconography in the system.</div>
</body></html>
