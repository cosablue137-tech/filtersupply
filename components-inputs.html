<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:var(--canvas);padding:34px 36px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:36px 48px;align-items:end}
  .field{display:flex;flex-direction:column;gap:10px}
  .field label{font-family:var(--font-meta);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
  .submit{display:flex;gap:0;border-bottom:1px solid var(--ink)}
  .submit input{flex:1}
  .submit button{border:none;background:none;font-family:var(--font-meta);font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;padding:0 4px}
</style></head>
<body>
  <div class="grid">
    <div class="field"><label>Email</label><input class="fs-input" placeholder="you@example.com"/></div>
    <div class="field"><label>Newsletter</label><div class="submit"><input class="fs-input" style="border-bottom:none" placeholder="Your email"/><button>Join →</button></div></div>
  </div>
</body></html>
